  <img src="images/00.webp" width="1672" height="941"

  <img src="images/01.webp" width="1672" height="941" loading="lazy"
       alt="1장. 원본은 추천 1건 단위로 셌다. 원본 txt 428개에서 작성 예시 4개와 README 1개를 빼면 추천 파일 423개. 목록 파일 6개는 가게 51건, 여러 곳을 소개한 글 15개는 곳마다 나눔. 원본 항목 500건.">
  <img src="images/02.webp" width="1672" height="941" loading="lazy"
       alt="2장. 정규화 3단계를 표에 적용했다. 제1정규형: 한 칸에 값 하나. 제2정규형: 이름은 한 곳에만. 제3정규형: 다른 칸으로 정해지는 거리 구분과 혼밥 칸을 뺐다.">
  <img src="images/03.webp" width="1672" height="941" loading="lazy"
       alt="3장. 시트 6개를 장소ID로 이었다. 장소 321줄, 추천기록 500줄, 메뉴 225줄, 운영시간 145줄, 사진 57줄, 검증.">
  <img src="images/04.webp" width="1672" height="941" loading="lazy"
       alt="4장. 이름과 위치가 둘 다 같아야 한 줄로. 부리또인 10건, 리밍 5건 합침. 학생식당 9건을 대학본부 복지관 1층으로. 종합강의관 1층 무인프린터, 복사실, 자동증명발급기는 따로. 321줄 중 95줄이 합친 줄.">
  <img src="images/05.webp" width="1672" height="941" loading="lazy"
       alt="5장. 네이버 지도로 이름과 주소를 확인했다. 링크 299개 풀기, 뒤바뀐 링크 2쌍 바로잡기, 테라피씨방을 테라와 PC방으로 넓게 검색, 30곳 재조회 29곳 일치, 터미널 주소를 충원대로 626으로.">
  <img src="images/06.webp" width="1672" height="941" loading="lazy"
       alt="6장. 두 번 확인했다. 추천 수 합 500과 원본 항목 500 일치. 원본과 5줄 대조로 지어낸 값 0건, 빠진 값 1건 고침.">
  <img src="images/07.webp" width="1672" height="941" loading="lazy"
       alt="7장. 같은 질문, 정리 전과 후. 프린트할 수 있는 곳: 정리 전 3분 48초 도구 15번, 정리 후 2분 54초 도구 9번으로 6곳.">
