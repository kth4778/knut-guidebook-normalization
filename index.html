<body>
<main>
  <img src="images/00.webp" width="1672" height="941"
       alt="표지. 교통대 꿀팁 가이드북 데이터 정리. 학생 20명이 모은 txt 428개를 앱에서 쓸 수 있는 표로 정리한 과정. 순서: 1 원본 상태, 2 규칙, 3 값 나누기, 4 지도 확인, 5 여러 번 검토, 6 제출물. 맛집, 숨은장소, 생활꿀팁, 자유. Claude 세션에서 여러 번 검토하며 정리.">
  <img src="images/01.webp" width="1672" height="941" loading="lazy"
       alt="1장. 정리 전 원본: 같은 내용을 다 다르게 적었다. 날짜 표기: 확인한 날: 2026-10-06, 확인한날:2026-10-06, 확인날짜 2026-10-06, 확인한 날: 26-10-06. 같은 가게, 다른 이름: 리밍교통대점, 리밍 교통대점, 리밍. 한 칸에 여러 값: 가격대: 타코 13,000원, 1인 바베큐 16,000~23,000원. 한 파일에 여러 곳: 술집 리스트 12곳. 비어 있는 값: 운영시간 빈칸, 확인 필요, 없음. 이대로 두면 AI도 같은 가게를 다른 곳으로 읽는다.">
  <img src="images/02.webp" width="1672" height="941" loading="lazy"
       alt="2장. 표를 다시 짤 때 지킨 규칙 세 가지. 1 한 곳은 한 줄: 술집 리스트 파일 1개를 12줄로. 2 한 칸엔 한 가지: 특징: 혼밥, 8천원, 조용함을 혼밥 여부, 가격, 분위기 세 칸으로. 3 같은 곳은 하나로: 청춘식당 ○○로 12 세 개를 한 줄로, 추천 수 3. 주의: 위치만 같으면 합치지 않는다, 한 건물에 층마다 다른 가게가 있다. 모르는 값은 비워 두지 않고 확인 안 됨.">
  <img src="images/03.webp" width="1672" height="941" loading="lazy"
       alt="3장. 앱이 바로 쓸 수 있게 값을 나눴다. 월~토 17:00~22:00, 매주 일요일 휴무는 여는 시각 17:00, 닫는 시각 22:00, 휴무 일요일로. 부리또 6,300~8,500원은 최저 6300, 최고 8500으로. 26-10-06은 2026-10-06으로. 충청북도 충주시는 충북 충주시로. 가성비 좋음은 가격: 확인 안 됨으로, 숫자를 지어내지 않는다. 이름과 주소는 꼭 남긴다, 원본이나 지도에 있는 값만. 혼밥은 어느 식당이나 돼서 최종 표에 따로 두지 않는다.">
  <img src="images/04.webp" width="1672" height="941" loading="lazy"
       alt="4장. 이름·주소가 조금씩 다르면 네이버 지도에서 직접 확인했다. 1 넓게 검색한다: 테라 피시방 충주점 대신 테라, PC방으로 짧게. 2 후보를 비교한다: 교통대 근처인가, 업종이 같은가, 이름이 이어지는가. 3 지도에 등록된 이름·주소로 맞춘다, 확인한 날짜도 함께 적는다. 예시 핵밥: 만정리 196과 대학로 6이 같은 지도 링크라 같은 가게로 합침.">
  <img src="images/05.webp" width="1672" height="941" loading="lazy"
       alt="5장. Claude 세션에서 여러 번 검토하고 고쳤다. 1차 정리: 원본을 읽고 칸을 채울 때 근거 문장을 같이 적게 했다. 검토 1: 근거 문장이 원문에 그대로 있는지 프로그램으로 전부 대조. 검토 2: 같은 곳 합치기 재확인, 이름·주소가 둘 다 같은지 보고 표기만 다르면 원문을 읽고 판단. 검토 3: 추천 수를 다 더한 값과 원본 항목 수 비교, 원본과 다섯 줄 대조. 마무리: 네이버 지도로 이름·주소를 확인하고 규칙을 다시 점검. 고친 예: 프린트 가격 0원, 원문의 무료는 서류 발급 이야기라 확인 안 됨으로 수정.">
  <img src="images/06.webp" width="1672" height="941" loading="lazy"
       alt="6장. 최종 제출물과 앱에서 달라지는 점. 제출물: 정규화 엑셀, 한 곳 한 줄, 추천 수 합과 원본 항목 수가 같음. 설명 txt, 칸마다 규칙과 이유, 정리 전후 비교. 앱에서 할 수 있는 것: 가격으로 거르기, 추천 많은 순으로 보기, 주소로 가까운 곳 찾기, 지도 링크 바로 열기.">
